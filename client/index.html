      '<div class="trek-muted" style="font-size:12px">' +
        esc([d.location, l.subtitle, l.area, l.priceLabel, ratingText(l)].filter(Boolean).join(' · ')) + '</div>' +
      photos +
      (hasCoordinates(l)
        ? '<div class="trek-sectionhead">Where you’ll be</div>' +
          '<div class="map-box" id="detail-map" data-lat="' + esc(l.lat) + '" data-lng="' + esc(l.lng) + '"></div>' +
          '<p class="map-note">Airbnb shows an approximate area until a booking is confirmed.</p>'
        : '') +
      priceRowsHtml(l) +
      (d.description ? '<p class="detail-desc">' + esc(d.description) + '</p>' : '') +
      (d.highlights ? '<div class="trek-sectionhead">Highlights</div><p class="detail-desc">' + esc(d.highlights) + '</p>' : '') +
      amenitiesHtml(d.amenities) +
      (d.houseRules ? '<div class="trek-sectionhead">House rules</div><p class="detail-desc">' + esc(d.houseRules) + '</p>' : '') +
      '</div>';
  }

  /* --------------------------------------------------------------- carousel */
  /* Photo bytes are proxied through the plugin (the frame's CSP blocks remote images),
     so the lightbox reuses the <img> elements already decoded in the strip rather than
     fetching anything again — opening it costs nothing. */
  var lbPics = [];
  var lbAt = 0;
  var lbReturn = null;

  function lbRender() {
    var stage = document.querySelector('#lb .lb-stage img');
    if (!stage) return;
    stage.src = lbPics[lbAt];
    stage.alt = 'Photo ' + (lbAt + 1) + ' of ' + lbPics.length;
    $('lb-count').textContent = (lbAt + 1) + ' / ' + lbPics.length;
    $('lb-prev').disabled = lbAt === 0;
    $('lb-next').disabled = lbAt === lbPics.length - 1;
    var strip = $('lb-strip');
    Array.prototype.forEach.call(strip.children, function (t, i) {
      t.classList.toggle('is-current', i === lbAt);
      if (i === lbAt) t.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
  }

  function lbGo(delta) {
    var next = lbAt + delta;
    if (next < 0 || next >= lbPics.length) return;
    lbAt = next;
    lbRender();
  }

  /**
   * Everything focusable inside the lightbox, in tab order.
   *
   * The dialog declares aria-modal="true" and sits LAST in the document, so without a
   * trap forward-Tab left the page entirely and Shift+Tab walked backwards into the
   * search bar and result cards — live controls sitting under an 88%-opaque backdrop.
   */
  function lbFocusables() {
    return Array.prototype.filter.call(
      $('lb').querySelectorAll('button:not([disabled]), [tabindex="0"]'),
      function (el) { return el.offsetWidth > 0 || el.offsetHeight > 0; },
    );
  }

  function lbClose() {
    $('lb').hidden = true;
    document.body.classList.remove('lb-open');
    // Hiding the backdrop is not the same as removing what is behind it from the tab
    // order and the accessibility tree; `inert` is the part that actually honours the
    // aria-modal claim.
    var page = document.querySelector('.trek-scroll');
    if (page) page.inert = false;
    lbPics = [];
    if (lbReturn && document.contains(lbReturn)) lbReturn.focus();
    lbReturn = null;
  }

  async function lbOpen(index) {
    // Resolve the full gallery through the shared proxy cache. A quick click while the
    // strip is still loading must not silently turn an eight-photo listing into a
    // one-photo lightbox.
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.detail-photos img'));
    var urls = imgs.map(function (im) { return im.getAttribute('data-photo-url') || ''; });
    var resolved = await Promise.all(urls.map(photoData));
    if (!document.querySelector('.detail-photos')) return;
    lbPics = resolved.filter(Boolean);
    if (!lbPics.length) return;
    lbAt = Math.max(0, Math.min(lbPics.length - 1,
      resolved.slice(0, Math.max(0, index)).filter(Boolean).length));
    lbReturn = imgs[index] || imgs[0] || null;
    $('lb-strip').innerHTML = lbPics.map(function (u, i) {
      return '<img alt="Go to photo ' + (i + 1) + '" role="button" tabindex="0" data-go="' + i + '" src="' + esc(u) + '" />';
    }).join('');
    $('lb').hidden = false;
    document.body.classList.add('lb-open');
    var page = document.querySelector('.trek-scroll');
    if (page) page.inert = true;
    lbRender();
    $('lb-close').focus();
  }

  document.addEventListener('click', function (e) {
    var thumb = e.target.closest('.detail-photos img[data-lb]');
    if (thumb) { lbOpen(Number(thumb.getAttribute('data-lb')) || 0); return; }
    if (!$('lb').hidden) {
      if (e.target.closest('#lb-prev')) return lbGo(-1);
      if (e.target.closest('#lb-next')) return lbGo(1);
      if (e.target.closest('#lb-close')) return lbClose();
      var go = e.target.closest('#lb-strip img[data-go]');
      if (go) { lbAt = Number(go.getAttribute('data-go')) || 0; return lbRender(); }
      // A click on the backdrop closes; one on the photo itself must not.
      if (e.target.closest('.lb-stage img') === null && e.target.closest('#lb')) return lbClose();
    }
  });

  document.addEventListener('keydown', function (e) {
    if ($('lb').hidden) {
      var t = e.target.closest && e.target.closest('.detail-photos img[data-lb]');
      if (t && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault(); lbOpen(Number(t.getAttribute('data-lb')) || 0);
      }
      return;
    }
    if (e.key === 'Tab') {
      // Cycle within the dialog. `inert` already removes the page behind it, so this
      // only has to close the loop at the two ends.
      var items = lbFocusables();
      if (!items.length) return;
      var first = items[0];
      var last = items[items.length - 1];
      var at = document.activeElement;
      if (e.shiftKey && (at === first || !$('lb').contains(at))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && (at === last || !$('lb').contains(at))) { e.preventDefault(); first.focus(); }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); lbClose(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); lbGo(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); lbGo(-1); }
    else if (e.key === 'Enter' || e.key === ' ') {
      var go = e.target.closest && e.target.closest('#lb-strip img[data-go]');
      if (go) { e.preventDefault(); lbAt = Number(go.getAttribute('data-go')) || 0; lbRender(); }
    }
  }, true);

  /** The card that opened the current detail view, so Back can put focus back where
   *  it came from instead of dropping it on <body>. */
  var returnFocusId = null;

  function showResults() {
    if (!$('lb').hidden) lbClose();
    $('detail').hidden = true;
    $('detail').innerHTML = '';
    $('results').hidden = false;
    $('more').hidden = !cursor;
    if (returnFocusId) {
      var back = document.querySelector('[data-details="' + returnFocusId + '"]');
      returnFocusId = null;
      if (back) back.focus();
    }
  }

  async function openDetails(id) {
    var l = byId(id);
    if (!l) return;
    returnFocusId = String(id);
    $('results').hidden = true;
    $('more').hidden = true;
    $('detail').hidden = false;
    $('detail').innerHTML = '<div class="trek-muted empty">Loading the listing…</div>';

    try {
      if (!detailCache[id]) {
        var q = '/listing?id=' + encodeURIComponent(id);
        if ($('checkin').value) q += '&checkin=' + encodeURIComponent($('checkin').value);
        if ($('checkout').value) q += '&checkout=' + encodeURIComponent($('checkout').value);
        q += '&adults=' + encodeURIComponent(String(guests.adults));
        detailCache[id] = await trek.invoke(q);
      }
      $('detail').innerHTML = detailHtml(l, detailCache[id]);
      $('detail-back').addEventListener('click', showResults);
      // The grid the user clicked from is now hidden, so focus has to follow the
      // view change or a keyboard user is left on a detached element.
      $('detail-back').focus();
      $('detail-open').addEventListener('click', function () { if (l.url) trek.openExternal(l.url); });
      loadPhotos();
      loadMap();
    } catch (err) {
      if (err.code === 403 || err.code === 401) {
        showResults();
        renderGate('disconnected');
        trek.notify('warning', err.message);
        return;
      }
      // Keep the user in the detail view with a way back, rather than a blank panel.
      $('detail').innerHTML = '<div class="trek-glass trek-stack" style="padding:16px">' +
        '<button class="trek-btn trek-btn--ghost" id="detail-back">&larr; Back to results</button>' +
        '<p class="trek-muted">' + esc(err.message || 'Could not load this listing.') + '</p></div>';
      $('detail-back').addEventListener('click', showResults);
    }
  }

  async function addToTrip(btn, l) {
    btn.disabled = true;
    var restore = btn.textContent;
    // The card's button is a 32px circle — only a glyph fits. The detail view's is a
    // full-width button where a bare tick would read as a mystery.
    var compact = btn.classList.contains('card-add');
    btn.textContent = compact ? '…' : 'Adding…';
    try {
      var added = await trek.invoke('/add', {
        method: 'POST',
        body: {
          tripId: Number(tripId), listing: l,
          checkin: $('checkin').value || null,
          checkout: $('checkout').value || null,
          adults: guests.adults,
        },
      });
      btn.textContent = compact ? '✓' : 'Added ✓';
      btn.classList.add('is-done');
      // Say what actually happened. A lodging block spanning the nights is a
      // materially different outcome from a pin on the map, and a budget line is a
      // third thing again — all three are opportunistic server-side, so the only
      // honest message is the one built from what came back.
      var outcome = added && added.accommodation
        ? l.name + ' added as lodging for those nights'
        : l.name + ' added to the trip';
      if (added && added.cost) outcome += ', and to the budget';
      trek.notify('success', outcome);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = restore;
      trek.notify('error', err.message || 'Could not add the stay');
    }
  }

  async function onCardClick(e) {
    // Add sits ON the card, so it has to win before the card's own details handler.
    var addBtn = e.target.closest('[data-add]');
    if (addBtn) {
      e.stopPropagation();
      var toAdd = byId(addBtn.getAttribute('data-add'));
      if (toAdd) await addToTrip(addBtn, toAdd);
      return;
    }
    var photoBtn = e.target.closest('[data-photo-nav]');
    if (photoBtn) {
      e.preventDefault();
      e.stopPropagation();
      moveCardPhoto(photoBtn, Number(photoBtn.getAttribute('data-photo-nav')) || 0);
      return;
    }
    var card = e.target.closest('[data-details]');
    if (card) openDetails(card.getAttribute('data-details'));
  }

  // One delegated handler serves both the grid and the detail panel, so the
  // detail view's "Add to trip" button behaves exactly like a card's.
  $('results').addEventListener('click', onCardClick);
  $('detail').addEventListener('click', onCardClick);
  // The card is a role="button", so it must answer the keyboard like one.
  $('results').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest('[data-details]');
    if (!card || e.target.closest('button')) return;
    e.preventDefault();
    openDetails(card.getAttribute('data-details'));
  });

  /** Restore the previous search so a tab switch does not throw the results away. */
  async function restore() {
    if (!tripId) return false;
    try {
      var last = await trek.invoke('/last?tripId=' + encodeURIComponent(tripId));
      if (!last || !last.results || !last.results.length) return false;
      listings = last.results;
      cursor = last.cursor || null;
      lastParams = last.params || null;
      if (last.params) {
        ['location', 'checkin', 'checkout', 'minPrice', 'maxPrice', 'propertyType']
          .forEach(function (k) { if (last.params[k] != null && $(k)) $(k).value = last.params[k]; });
        if (last.params.adults != null) guests.adults = Math.max(1, Number(last.params.adults) || 1);
        if (last.params.children != null) guests.children = Math.max(0, Number(last.params.children) || 0);
      }
      renderGuests();
      syncPlaceType();
      renderFilterCount();
      renderDateValues();
      render();
      loadCommutes();
      return true;
    } catch (_) { return false; }
  }

  /** First run, nothing searched yet — say what to do instead of showing a void. */
  function renderIntro() {
    $('results').innerHTML =
      '<div class="trek-muted empty" style="grid-column:1/-1">' +
      '<div class="empty-title">Where to?</div>' +
      'Your trip’s dates are already filled in — type a destination and press Search.</div>';
  }

  async function seedDefaults() {
    if (!tripId) return;
    try {
      var d = await trek.invoke('/defaults?tripId=' + encodeURIComponent(tripId));
      if (d.checkin && !$('checkin').value) $('checkin').value = d.checkin;
      if (d.checkout && !$('checkout').value) $('checkout').value = d.checkout;
      if (d.location && !$('location').value) $('location').value = d.location;
      renderDateValues();
    } catch (_) { /* the form still works unseeded */ }
  }

  async function boot() {
    renderGuests();
    renderFilterCount();
    renderDateValues();
    try {
      var s = await trek.invoke('/status');
      missingKeys = Array.isArray(s.missing) ? s.missing : [];
      // /status names the gaps twice: `missing` is the storage keys an admin PUTs to
      // the config API, `missingLabels` is what the settings FORM calls them. The form
      // is what this panel sends people to, so it reads the labels and falls back to
      // the keys only on a host too old to send them.
      missingLabels = Array.isArray(s.missingLabels) && s.missingLabels.length ? s.missingLabels : missingKeys;
      if (!s.configured) return renderGate('unconfigured');
      if (!s.connected) return renderGate('disconnected');
      renderGate('ok');
      // Before restoring, so the restored grid is sorted and measured the way the
      // traveller left it rather than snapping into place a moment later.
      await loadViewPrefs();
      var restored = await restore();
      if (!restored) {
        await seedDefaults();
        renderIntro();
      }
    } catch (e) {
      renderGate('unconfigured');
      trek.notify('error', e.message || 'Could not reach the plugin');
    }
  }

  var started = false;
  trek.onContext(function (ctx) {
    tripId = ctx.tripId;
    // The host re-posts the context when the appearance changes, so this tracks the
    // traveller's light/dark choice and the next map matches it.
    if (ctx.theme) currentTheme = ctx.theme;
    if (!started) { started = true; boot(); }
  });
})();
</script>

<!-- Photo carousel. Outside .trek-scroll so it covers the frame rather than scrolling
     inside it; position:fixed resolves against the frame's viewport. -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Listing photos" hidden>
  <div class="lb-bar">
    <span id="lb-count">1 / 1</span>
    <button type="button" class="lb-close" id="lb-close" aria-label="Close photos">&times;</button>
  </div>
  <div class="lb-stage">
    <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img alt="" />
    <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo">&#8250;</button>
  </div>
  <div class="lb-strip" id="lb-strip"></div>
</div>
</body>
</html>
